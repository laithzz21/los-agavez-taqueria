name: Rename file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename the site file
        run: git mv los-agavez-taqueria-website.html index.html
      - name: Commit and push
        run: |
          git config user.name "laithzz21"
          git config user.email "laithzz21@users.noreply.github.com"
          git commit -m "Rename los-agavez-taqueria-website.html to index.html"
          git push
